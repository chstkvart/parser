<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Где дешевле — поиск по маркетплейсам</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Где дешевле?</h1>
    <p class="subtitle">Ищем самый популярный и высоко оценённый товар на Wildberries, Ozon, Яндекс Маркете и Мегамаркете</p>

    <form id="search-form">
      <input id="query" type="search" placeholder="Например, iPhone 16" autocomplete="off" minlength="2" required autofocus>      <button type="submit" id="search-btn">Найти</button>
    </form>

    <div id="summary" class="summary" hidden></div>
    <section id="results" class="results"></section>
    <p id="disclaimer" class="disclaimer" hidden>
      Показываем цену, которую маркетплейс показывает покупателю без входа в аккаунт.
      Если вы вошли в аккаунт или выбрали адрес доставки, маркетплейс может показать вам другую цену.
    </p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
